name: Drift

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  drift:
    uses: intisy/workflows/.github/workflows/drift.yml@main
    with:
      kit_repository: weivel/conformance
      kit_ref: 39ceadc8e2e85372973903990fcb6c9d975467be
      role: core
      checks: purity names core-gate core-sources benchmark vectors
      runners: '["ubuntu-latest","windows-latest","macos-latest"]'
